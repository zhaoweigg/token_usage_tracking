name: Headroom
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "TXCLU6TPCW"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.6.2"
    CURRENT_PROJECT_VERSION: "13"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Headroom:
    type: application
    platform: iOS
    sources:
      - Headroom
      - HeadroomShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.headroom
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HEADROOM_APP"
        INFOPLIST_KEY_CFBundleDisplayName: Headroom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Headroom/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.headroom.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.example.headroom
            CFBundleURLSchemes:
              - headroom
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Headroom/Headroom.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.headroom
    dependencies:
      - target: HeadroomWidgets
        embed: true
  HeadroomWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HeadroomWidgets
      - HeadroomShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.headroom.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: HeadroomWidgets/Info.plist
      properties:
        CFBundleDisplayName: Headroom
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HeadroomWidgets/HeadroomWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.headroom
  HeadroomTests:
    type: bundle.unit-test
    platform: iOS
    sources: HeadroomTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Headroom
  HeadroomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: HeadroomUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Headroom
schemes:
  Headroom:
    build:
      targets:
        Headroom: all
        HeadroomWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeadroomTests
        - HeadroomUITests
      gatherCoverageData: false
